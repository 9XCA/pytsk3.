name: Build pytsk3 Windows Wheel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Sleuth Kit
        run: choco install sleuthkit --no-progress

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install wheel setuptools

      - name: Build pytsk3 wheel
        run: pip wheel pytsk3 --wheel-dir=dist

      - uses: actions/upload-artifact@v4
        with:
          name: pytsk3-wheel-cp311-win_amd64
          path: dist/*.whl
