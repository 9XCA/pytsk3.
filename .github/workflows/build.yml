name: Build pytsk3 wheel for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 安装编译依赖
      - name: Install build tools
        run: |
          choco install visualstudio2022buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended" --no-progress
          choco install sleuthkit --no-progress
          echo "C:\Program Files\Sleuth Kit\bin" >> $env:PATH
          echo "SLEUTHKIT_INCLUDE=C:\Program Files\Sleuth Kit\include" >> $env:GITHUB_ENV
          echo "SLEUTHKIT_LIB=C:\Program Files\Sleuth Kit\lib" >> $env:GITHUB_ENV

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      # 关键：强制从 PyPI 构建，忽略本地目录
      - name: Build pytsk3 wheel
        run: |
          pip wheel pytsk3==20230310 --wheel-dir=dist --no-build-isolation

      - uses: actions/upload-artifact@v4
        with:
          name: pytsk3-wheel
          path: dist/*.whl
