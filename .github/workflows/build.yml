name: Build pytsk3 wheel for Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install wheel

      - name: Build pytsk3 wheel
        run: |
          pip wheel pytsk3 --wheel-dir=dist

      - name: Upload wheel as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytsk3-wheel-cp${{ matrix.python-version }}-win_amd64
          path: dist/*.whl
